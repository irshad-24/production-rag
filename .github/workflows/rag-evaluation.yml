
name: RAG Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Clear previous generated evaluation data
        run: |
          rm -f evaluation/evaluation_state.json
          rm -f evaluation/evaluation_data.json

      - name: Generate fresh RAG answers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python evaluation/evaluate.py

      - name: Clear previous metric scores
        run: rm -f evaluation/ragas_scores.json

      - name: Run RAGAS evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python evaluation/run_ragas.py

      - name: Check quality thresholds
        run: python evaluation/check_regression.py

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-results
          path: |
            evaluation/evaluation_data.json
            evaluation/ragas_scores.json
          if-no-files-found: ignore
          retention-days: 30
